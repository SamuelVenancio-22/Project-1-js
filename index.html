<!DOCTYPE html>
<html lang="pt-br">

<head>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">
   <link rel="stylesheet" href="style.css">
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Project-Converter</title>
</head>

<body>

   <main>
      <img class="logo-money" src="assets/logo.gif" alt="logo-money">


      <section class="section-1">
       
         <div class="div-1">
          <p>Converter <b>de</b> </p>
          <select>
             <option>R$ Real Brasileiro</option>
          </select>

          <p>Converter <b>para</b> </p>
          <select>
             <option>U$ Dólar Americano</option>
             <option>€ Euro</option>
          </select>

          <p> <b>Valor:</b> </p>
          <input type="number" placeholder="R$ 10.000,00">

          <button>Converter</button>
         </div>

         <section class="section-2">

            <div>
               <img src="assets/Bandeira-br.avif" alt="br-flag">
               <p>Real</p>
               <p>R$ 0,00</p>
            </div>

            <img src="assets/Vector.png" alt="seta">

            <div>
               <img src="assets/flag-USA.webp" alt="Usa-flag">
               <p>Dólar Americano</p>
               <p>US$ 0.00</p>
            </div>
         </section>

      </section>

   </main>

</body>

</html>
